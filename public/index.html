<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>One Million Checkboxes</title>

        <link rel="stylesheet" href="./style.css" />
    </head>
    <body>
        <nav class="navbar">
            <div class="navbar-right">
                <div id="user-info" class="user-info" style="display: none">
                    <span id="user-name"></span>
                </div>
                <a
                    id="login-btn"
                    href="/auth/login"
                    class="btn btn-primary"
                    style="display: none"
                >
                    Login
                </a>
                <a
                    id="logout-btn"
                    href="/auth/logout"
                    class="btn btn-secondary"
                    style="display: none"
                >
                    Logout
                </a>
            </div>
        </nav>

        <header>
            <h1>One Million Checkboxes</h1>
            <p class="author">Made By Sameer Bhagtani</p>
        </header>

        <section class="top-row">
            <div id="counter">
                Checked: <span id="checked-count">0</span>/1,000,000
            </div>
        </section>

        <div id="login-message" class="login-message" style="display: none">
            <p>👉 Log in to participate!</p>
        </div>

        <div class="main-content">
            <div id="container"></div>
        </div>

        <script src="/socket.io/socket.io.js"></script>
        <script src="./auth.js"></script>
        <script src="./script.js"></script>
    </body>
</html>
